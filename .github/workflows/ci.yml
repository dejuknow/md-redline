name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # OS-independent checks plus the web end-to-end suite. These do not vary by
  # platform, so they run once on Linux to keep CI fast.
  checks:
    # Pinned because ubuntu-latest became Ubuntu 26.04 in October 2026, and
    # Playwright 1.58 can't install Chromium there. Unpin once Playwright is
    # on a release that supports 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate eval fixtures
        run: npm run eval:dry

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e -- --project=chromium

  # The selection, copy and context-menu specs in WebKit (Safari's engine). On
  # macOS, not Linux: the behaviours behind #228 and #229 (the word a
  # right-click selects, the mouseup a context menu swallows) are WebKit's
  # macOS editing behaviour, and Linux WebKit would pass without the fixes.
  webkit:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install webkit

      - name: End-to-end tests (WebKit)
        run: npx playwright test --project=webkit

  # Unit and CLI tests across all three OSes. This is where platform-specific
  # behaviour lives: process spawning, path handling, and the browser launcher
  # (the class of bug that unit tests on a single OS cannot catch).
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The MCP stdio subprocess tests spawn `bin/md-redline mcp`, which needs
      # dist/server.js (its production-mode probe) and dist/mcp-stdio.js (the
      # bundle it runs). Without them the whole suite skips itself, so the
      # spawn path shipped untested for as long as this job has been green.
      # build:server is esbuild only, no tsc or vite, and takes well under a
      # second, so this buys real coverage on all three platforms for
      # essentially no runtime. Spawning is exactly what this matrix is for.
      - name: Build server bundles
        run: npm run build:server

      - name: Unit and CLI tests
        run: npm run test:unit
