<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>md-redline</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #faf9f7; color: #57534e;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1917; color: #a8a29e; }
  }
  .wrap { text-align: center; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 14px;
    border: 3px solid currentColor; border-top-color: #dc2626;
    border-radius: 50%; opacity: 0.7;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 14px; }
  .hint { font-size: 12px; opacity: 0.7; margin-top: 6px; display: none; }
  body.error .spinner { animation: none; border-color: #dc2626; opacity: 0.4; }
  body.error .hint { display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div class="msg">Starting md-redline…</div>
    <div class="hint">Could not start the md-redline server. Run <code>mdr</code> in a terminal to open it here. Details are in <code>~/Library/Logs/mdr/server-start.log</code>.</div>
  </div>
</body>
</html>
